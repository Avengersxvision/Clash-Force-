<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hug Day | Megh & Jia ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --megh-color: #a2d2ff;
            --jia-color: #ffafcc;
            --merge-color: #cdb4db;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; font-family: 'Montserrat', sans-serif;
            touch-action: none; background: #fff;
        }

        /* Split Background */
        .bg-layer {
            position: absolute; width: 100%; height: 100%;
            display: flex; transition: background 1.5s ease;
            z-index: 0;
        }

        #left-bg { width: 50%; background: var(--megh-color); }
        #right-bg { width: 50%; background: var(--jia-color); }

        .container {
            position: relative; width: 100%; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            z-index: 10;
        }

        /* The Orbs */
        .orb {
            position: absolute; width: 80px; height: 80px;
            border-radius: 50%; background: white;
            box-shadow: 0 0 30px rgba(255,255,255,0.8);
            cursor: grab; display: flex; align-items: center;
            justify-content: center; font-size: 0.7rem; font-weight: 600;
            color: #555; transition: transform 0.2s;
        }

        #orb-megh { left: 15%; }
        #orb-jia { right: 15%; }

        /* The Resulting Heart */
        #final-heart {
            font-size: 120px; position: absolute;
            opacity: 0; transform: scale(0.5);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; z-index: 20;
        }

        /* Polaroid Message */
        .polaroid {
            position: absolute; bottom: -300px; width: 250px;
            background: white; padding: 15px 15px 40px 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transform: rotate(-3deg); transition: all 1s ease;
            z-index: 30; text-align: center;
        }

        .polaroid img { width: 100%; height: 200px; background: #eee; object-fit: cover; margin-bottom: 15px; }
        .polaroid p { font-family: 'Dancing Script', cursive; font-size: 1.4rem; color: #333; margin: 0; }

        /* Animation States */
        .merged #left-bg, .merged #right-bg { background: var(--merge-color) !important; width: 100%; }
        .merged #final-heart { opacity: 1; transform: scale(1.2); animation: pulse 1s infinite alternate; }
        .merged .polaroid { bottom: 10%; transform: rotate(2deg); }
        .merged .orb { opacity: 0; transform: scale(0); }

        @keyframes pulse { from { transform: scale(1.2); } to { transform: scale(1.4); } }

        .hint {
            position: absolute; top: 15%; width: 100%; text-align: center;
            color: white; letter-spacing: 3px; font-weight: 300; font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="bg-layer" id="bg-full">
        <div id="left-bg"></div>
        <div id="right-bg"></div>
    </div>

    <div class="hint" id="hint">BRING THE SOULS TOGETHER</div>

    <div class="container" id="stage">
        <div class="orb" id="orb-megh">MEGH</div>
        <div class="orb" id="orb-jia">JIA</div>
        
        <div id="final-heart">💖</div>

        <div class="polaroid" id="photo-msg">
            <div style="width:100%; height:180px; background: #ffe5ec; display:flex; align-items:center; justify-content:center; font-size:40px;">🫂</div>
            <p>Happy Hug Day, Jia!<br>My favorite place is inside your hug.</p>
        </div>
    </div>

    <script>
        const megh = document.getElementById('orb-megh');
        const jia = document.getElementById('orb-jia');
        const stage = document.getElementById('stage');
        const hint = document.getElementById('hint');

        function checkMerge() {
            const r1 = megh.getBoundingClientRect();
            const r2 = jia.getBoundingClientRect();

            // Check if center points are close
            const distance = Math.abs(r1.right - r2.left);
            
            if (distance < 10) {
                stage.classList.add('merged');
                hint.style.opacity = '0';
            }
        }

        function moveOrb(el, isLeft, clientX) {
            if (stage.classList.contains('merged')) return;
            
            let xPercent = (clientX / window.innerWidth) * 100;
            
            if (isLeft) {
                if (xPercent < 50) el.style.left = (xPercent - 5) + "%";
            } else {
                let rightPercent = 100 - xPercent;
                if (rightPercent < 50) el.style.right = (rightPercent - 5) + "%";
            }
            checkMerge();
        }

        // Mouse Drag
        document.addEventListener('mousemove', (e) => {
            if (e.buttons !== 1) return;
            if (e.target.id === 'orb-megh') moveOrb(megh, true, e.clientX);
            if (e.target.id === 'orb-jia') moveOrb(jia, false, e.clientX);
        });

        // Touch Drag
        megh.addEventListener('touchmove', (e) => { e.preventDefault(); moveOrb(megh, true, e.touches[0].clientX); });
        jia.addEventListener('touchmove', (e) => { e.preventDefault(); moveOrb(jia, false, e.touches[0].clientX); });

    </script>
</body>
</html>
