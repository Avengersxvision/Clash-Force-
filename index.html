<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chocolate Day | For Jia ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;600&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fff5f5;
            --box-outer: #ffccd5;
            --box-inner: #fff;
            --choco: #6d4c41;
            --accent: #ff8fa3;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; background-color: var(--bg);
            font-family: 'Quicksand', sans-serif;
        }

        .container {
            width: 100%; height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }

        /* The Box Container */
        .bento-wrapper {
            position: relative; width: 300px; height: 300px;
            cursor: pointer; perspective: 1000px;
        }

        /* The Lid */
        .lid {
            position: absolute; width: 100%; height: 100%;
            background: var(--box-outer); border-radius: 20px;
            z-index: 10; display: flex; justify-content: center;
            align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 8px solid #fff; box-sizing: border-box;
        }

        .lid-text {
            font-family: 'Sacramento', cursive;
            font-size: 2.5rem; color: #ff4d6d; text-align: center;
        }

        /* The Tray Inside */
        .tray {
            position: absolute; width: 100%; height: 100%;
            background: var(--box-inner); border-radius: 20px;
            display: grid; grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr; padding: 15px;
            box-sizing: border-box; gap: 10px;
            border: 4px solid var(--box-outer);
        }

        .compartment {
            background: #fffafa; border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            font-size: 40px; transition: transform 0.3s ease;
            position: relative;
        }

        .compartment:hover { transform: scale(1.05); }

        /* Pop-up Message */
        #msg-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9); border-radius: 20px;
            z-index: 20; display: none; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; padding: 20px; box-sizing: border-box;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .msg-text { color: var(--choco); font-weight: 600; line-height: 1.4; }

        .back-btn {
            margin-top: 15px; padding: 5px 15px; font-size: 12px;
            background: var(--accent); color: white; border: none;
            border-radius: 20px; cursor: pointer;
        }

        /* Lift the lid animation */
        .lifted { transform: translateY(-120%) rotateX(20deg); opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div class="container">
        <p style="color: var(--accent); letter-spacing: 2px; margin-bottom: 20px; font-weight: 600;">FOR MY SWEETEST JIA</p>
        
        <div class="bento-wrapper">
            <div class="lid" id="lid" onclick="openBox()">
                <div class="lid-text">Handcrafted<br>for You</div>
            </div>

            <div class="tray">
                <div class="compartment" onclick="showMsg('My life is sweet, but it would be nothing without you. ❤️')">💝</div>
                <div class="compartment" onclick="showMsg('You are like dark chocolate—intense, deep, and totally addictive. 😉')">🍫</div>
                <div class="compartment" onclick="showMsg('Can I have you as my dessert forever? Happy Chocolate Day! 😘')">🧸</div>
                <div class="compartment" onclick="showMsg('One bite is never enough when it comes to your love. ✨')">🍩</div>
                
                <div id="msg-overlay">
                    <p class="msg-text" id="active-msg"></p>
                    <button class="back-btn" onclick="closeMsg()">Eat Another? ✨</button>
                </div>
            </div>
        </div>

        <p id="instruction" style="margin-top: 30px; font-size: 0.8rem; color: #aaa;">Tap to open the box</p>
    </div>

    <script>
        function openBox() {
            document.getElementById('lid').classList.add('lifted');
            document.getElementById('instruction').innerText = "Pick a treat, Jia!";
        }

        function showMsg(text) {
            document.getElementById('active-msg').innerText = text;
            document.getElementById('msg-overlay').style.display = 'flex';
        }

        function closeMsg() {
            document.getElementById('msg-overlay').style.display = 'none';
        }
    </script>
</body>
</html>
