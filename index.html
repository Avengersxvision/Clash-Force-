<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chocolate Day | For Jia ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --wrapper: #7b1113; /* Deep Maroon/Red */
            --gold: #d4af37;
            --chocolate: #3d1d16;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; background: #1a1a1a;
            font-family: 'Playfair Display', serif;
        }

        .container {
            width: 100%; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            perspective: 1000px;
        }

        /* The Chocolate Bar */
        .chocolate-bar {
            position: relative;
            width: 280px; height: 450px;
            background: var(--chocolate);
            border-radius: 5px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: center;
        }

        /* The Gold Foil Layer */
        .foil {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #cfb53b 0%, #d4af37 45%, #fcf4a3 50%, #d4af37 55%, #cfb53b 100%);
            z-index: 3; transition: transform 1.5s ease-in-out, opacity 1s;
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
        }

        /* The Paper Wrapper */
        .wrapper {
            position: absolute; top: -5%; left: -5%; width: 110%; height: 110%;
            background: var(--wrapper);
            z-index: 4; display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            border: 2px solid var(--gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 1s ease-in-out, opacity 0.5s;
        }

        .wrapper-brand {
            color: var(--gold); border: 2px solid var(--gold);
            padding: 10px 20px; font-size: 1.5rem; text-transform: uppercase;
            letter-spacing: 3px; font-style: italic;
        }

        .instruction {
            margin-top: 20px; color: white; font-size: 0.8rem;
            letter-spacing: 2px; opacity: 0.7;
        }

        /* The Golden Ticket */
        .golden-ticket {
            position: absolute; width: 90%; height: 60%;
            background: #ffd700; background: linear-gradient(135deg, #fff3b0 0%, #ffd700 100%);
            z-index: 2; padding: 20px; box-sizing: border-box;
            border: 2px dashed #b8860b; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            transform: scale(0.8); opacity: 0; transition: all 1s ease;
        }

        .ticket-msg {
            font-family: 'Dancing Script', cursive;
            color: #3d1d16; font-size: 1.5rem; line-height: 1.4;
        }

        /* Swiped classes */
        .torn-wrapper { transform: translateY(-110%) rotate(-5deg); opacity: 0; }
        .torn-foil { transform: translateY(110%) rotate(5deg); opacity: 0; }
        .show-ticket { transform: scale(1.1); opacity: 1; }

    </style>
</head>
<body>

    <div class="container">
        <div class="chocolate-bar" id="bar" onclick="unwrap()">
            
            <div class="wrapper" id="wrapper">
                <div class="wrapper-brand">Megh's Special</div>
                <div style="color: var(--gold); margin-top: 10px;">Premium Chocolate</div>
                <div class="instruction">TAP TO UNWRAP</div>
            </div>

            <div class="foil" id="foil"></div>

            <div class="golden-ticket" id="ticket">
                <div style="font-weight: bold; color: #b8860b; margin-bottom: 10px;">YOU FOUND THE GOLDEN TICKET</div>
                <div class="ticket-msg">
                    Like this chocolate, you are the sweetest part of my life. <br><br>
                    Happy Chocolate Day, Jia! <br>❤️
                </div>
            </div>

        </div>
    </div>

    <script>
        let step = 0;

        function unwrap() {
            if (step === 0) {
                // Remove paper wrapper
                document.getElementById('wrapper').classList.add('torn-wrapper');
                step++;
            } else if (step === 1) {
                // Remove foil
                document.getElementById('foil').classList.add('torn-foil');
                step++;
                // Show ticket
                setTimeout(() => {
                    document.getElementById('ticket').classList.add('show-ticket');
                }, 500);
            }
        }
    </script>
</body>
</html>
