<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hug Day | For Jia ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky: #d0eefb;
            --snow-white: #ffffff;
            --snow-shadow: #d1e5f0;
            --carrot: #ff9800;
            --wood: #5d4037;
            --heart: #ff4d6d;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; font-family: 'Quicksand', sans-serif;
            background: var(--sky); touch-action: none;
        }

        .winter-bg {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #a2d2ff 0%, #ffffff 80%, #f0f8ff 100%);
            z-index: 0;
        }

        /* The Snowman - Improved Proportions & Shading */
        .snowman {
            position: absolute; bottom: 15%; width: 140px;
            display: flex; flex-direction: column; align-items: center;
            z-index: 5; cursor: grab; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
        }

        #snowman-left { left: 5%; }
        #snowman-right { right: 5%; }

        .snowball {
            background: radial-gradient(circle at 30% 30%, var(--snow-white), var(--snow-shadow));
            border-radius: 50%;
            position: relative;
        }

        .head { width: 65px; height: 65px; z-index: 3; }
        .body-mid { width: 95px; height: 85px; margin-top: -15px; z-index: 2; }
        .body-base { width: 130px; height: 110px; margin-top: -20px; z-index: 1; }

        /* Face details */
        .face { position: absolute; top: 22px; width: 100%; display: flex; justify-content: center; align-items: center; }
        .eye { width: 7px; height: 7px; background: #222; border-radius: 50%; margin: 0 6px; }
        .nose { 
            width: 0; height: 0; 
            border-top: 4px solid transparent; 
            border-bottom: 4px solid transparent; 
            border-left: 18px solid var(--carrot);
            border-radius: 2px;
        }

        /* Stick Hands - Branch Style */
        .stick-hand {
            position: absolute; width: 110px; height: 6px;
            background: var(--wood); top: 40px; z-index: 4;
            border-radius: 10px;
        }

        #hand-left { 
            left: 70px; transform: rotate(-15deg); transform-origin: left center;
        }
        #hand-right { 
            right: 70px; transform: rotate(15deg); transform-origin: right center;
        }

        /* Center Heart Pulse */
        .heart-container {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            z-index: 2; pointer-events: none;
        }

        #heart-emoji {
            font-size: 100px; opacity: 0; transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .hug-active #heart-emoji {
            opacity: 1; transform: scale(1.3);
            animation: pulse 0.8s infinite alternate;
        }

        @keyframes pulse { 
            from { transform: scale(1.2); filter: drop-shadow(0 0 10px var(--heart)); } 
            to { transform: scale(1.5); filter: drop-shadow(0 0 30px var(--heart)); } 
        }

        /* Message Styling */
        #msg-card {
            position: absolute; bottom: 5%; width: 85%; left: 7.5%;
            background: white; padding: 15px; border-radius: 20px;
            text-align: center; color: #2c3e50; font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            opacity: 0; transform: translateY(20px);
            transition: all 0.5s; z-index: 10;
        }

        .show-msg { opacity: 1 !important; transform: translateY(0) !important; }

        /* Snowflake animation */
        .snowflake { position: absolute; color: white; top: -20px; pointer-events: none; animation: fall linear infinite; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>

    <div class="winter-bg"></div>

    <div class="heart-container">
        <div id="heart-emoji">❤️</div>
    </div>

    <div class="snowman" id="snowman-left">
        <div class="snowball head">
            <div class="face">
                <div class="eye"></div>
                <div class="nose"></div>
                <div class="eye"></div>
            </div>
        </div>
        <div class="snowball body-mid"></div>
        <div class="snowball body-base"></div>
        <div class="stick-hand" id="hand-left"></div>
    </div>

    <div class="snowman" id="snowman-right">
        <div class="snowball head">
            <div class="face">
                <div class="eye"></div>
                <div class="nose" style="transform: rotate(180deg);"></div>
                <div class="eye"></div>
            </div>
        </div>
        <div class="snowball body-mid"></div>
        <div class="snowball body-base"></div>
        <div class="stick-hand" id="hand-right"></div>
    </div>

    <div id="msg-card"></div>

    <script>
        const sLeft = document.getElementById('snowman-left');
        const sRight = document.getElementById('snowman-right');
        const hLeft = document.getElementById('hand-left');
        const hRight = document.getElementById('hand-right');
        const msgCard = document.getElementById('msg-card');

        const quotes = [
            "Jia, your hugs are the only thing that can melt Megh's heart! ❄️❤️",
            "Warning: This hug might result in extreme happiness.",
            "Winter is cold, but Megh's arms are warm just for you.",
            "I'm 'snow' lucky to have your hugs, Jia!",
            "Even a frozen snowman feels warm when you're around.",
            "Let's stay in this hug until winter ends? 😘"
        ];

        let isHugging = false;

        function checkHug() {
            const rectL = hLeft.getBoundingClientRect();
            const rectR = hRight.getBoundingClientRect();

            // Detect collision between the "stick hands"
            if (rectR.left - rectL.right < 5) {
                if (!isHugging) {
                    isHugging = true;
                    document.body.classList.add('hug-active');
                    msgCard.innerText = quotes[Math.floor(Math.random() * quotes.length)];
                    msgCard.classList.add('show-msg');
                    if(navigator.vibrate) navigator.vibrate(50);
                }
            } else {
                isHugging = false;
                document.body.classList.remove('hug-active');
                msgCard.classList.remove('show-msg');
            }
        }

        function moveSnowman(snowman, isLeft, clientX) {
            let xPercent = (clientX / window.innerWidth) * 100;
            
            // Limit movement so they don't go off screen or past the center
            if (isLeft) {
                if (xPercent < 48) snowman.style.left = (xPercent - 10) + "%";
            } else {
                let rightX = 100 - xPercent;
                if (rightX < 48) snowman.style.right = (rightX - 10) + "%";
            }
            checkHug();
        }

        // Mouse Drag
        document.addEventListener('mousemove', (e) => {
            if (e.buttons !== 1) return;
            if (e.target.closest('#snowman-left')) moveSnowman(sLeft, true, e.clientX);
            if (e.target.closest('#snowman-right')) moveSnowman(sRight, false, e.clientX);
        });

        // Touch Drag
        const touchMove = (e, isLeft) => {
            e.preventDefault();
            moveSnowman(isLeft ? sLeft : sRight, isLeft, e.touches[0].clientX);
        };

        sLeft.addEventListener('touchmove', (e) => touchMove(e, true));
        sRight.addEventListener('touchmove', (e) => touchMove(e, false));

        // Background Snow Effect
        function createSnowflake() {
            const f = document.createElement('div');
            f.className = 'snowflake';
            f.innerHTML = '❄';
            f.style.left = Math.random() * 100 + 'vw';
            f.style.fontSize = Math.random() * 15 + 10 + 'px';
            f.style.animationDuration = Math.random() * 3 + 2 + 's';
            f.style.opacity = Math.random() * 0.7 + 0.3;
            document.body.appendChild(f);
            setTimeout(() => f.remove(), 5000);
        }
        setInterval(createSnowflake, 300);
    </script>
</body>
</html>
