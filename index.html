<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hug Day | For Jia ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky: #a2d2ff;
            --snow: #ffffff;
            --wood: #5d4037;
            --heart: #ff4d6d;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; font-family: 'Quicksand', sans-serif;
            background: var(--sky); touch-action: none;
        }

        .winter-bg {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #a2d2ff 0%, #ffffff 100%);
            z-index: 0;
        }

        /* Snowman Body Parts */
        .snowman {
            position: absolute; bottom: 15%; width: 120px;
            display: flex; flex-direction: column; align-items: center;
            z-index: 5; cursor: grab; transition: transform 0.1s;
        }

        #snowman-left { left: 5%; }
        #snowman-right { right: 5%; }

        .head { width: 60px; height: 60px; background: white; border-radius: 50%; position: relative; border-bottom: 2px solid #ddd; }
        .body-mid { width: 90px; height: 80px; background: white; border-radius: 50%; margin-top: -10px; border-bottom: 2px solid #ddd; }
        .body-base { width: 120px; height: 100px; background: white; border-radius: 50%; margin-top: -15px; }

        .face { position: absolute; top: 20px; width: 100%; display: flex; justify-content: center; }
        .eye { width: 6px; height: 6px; background: #333; border-radius: 50%; margin: 0 5px; }
        .carrot { width: 15px; height: 6px; background: #ff9800; border-radius: 0 50% 50% 0; margin-top: 5px; }

        /* Stick Hands */
        .hand {
            position: absolute; width: 100px; height: 8px;
            background: var(--wood); top: 50%; z-index: 4;
            border-radius: 5px; transition: width 0.1s;
        }

        #hand-left { left: 80px; transform: rotate(-10deg); transform-origin: left; }
        #hand-right { right: 80px; transform: rotate(10deg); transform-origin: right; }

        /* Center Heart */
        .center-heart {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            font-size: 100px; opacity: 0; transition: all 0.5s; z-index: 2;
        }

        .hug-active .center-heart { opacity: 1; transform: translate(-50%, -50%) scale(1.2); animation: pulse 0.8s infinite alternate; }

        @keyframes pulse { from { transform: translate(-50%, -50%) scale(1.2); } to { transform: translate(-50%, -50%) scale(1.5); } }

        /* Message */
        #msg-box {
            position: absolute; bottom: 5%; width: 90%; left: 5%;
            text-align: center; color: var(--wood); font-weight: 600;
            background: rgba(255,255,255,0.8); padding: 15px;
            border-radius: 20px; opacity: 0; transition: opacity 0.5s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); z-index: 10;
        }

        .show-msg { opacity: 1 !important; }

        /* Snowflakes */
        .snowflake { position: absolute; color: white; top: -20px; animation: fall linear infinite; z-index: 1; }
        @keyframes fall { to { transform: translateY(110vh); } }
    </style>
</head>
<body>

    <div class="winter-bg"></div>

    <div class="center-heart" id="heart">❤️</div>

    <div class="snowman" id="snowman-left">
        <div class="head">
            <div class="face"><div class="eye"></div><div class="eye"></div><div class="carrot"></div></div>
        </div>
        <div class="body-mid"></div>
        <div class="body-base"></div>
        <div class="hand" id="hand-left"></div>
    </div>

    <div class="snowman" id="snowman-right">
        <div class="head">
            <div class="face"><div class="eye"></div><div class="eye"></div><div class="carrot" style="transform: scaleX(-1);"></div></div>
        </div>
        <div class="body-mid"></div>
        <div class="body-base"></div>
        <div class="hand" id="hand-right"></div>
    </div>

    <div id="msg-box"></div>

    <script>
        const sLeft = document.getElementById('snowman-left');
        const sRight = document.getElementById('snowman-right');
        const hLeft = document.getElementById('hand-left');
        const hRight = document.getElementById('hand-right');
        const heart = document.getElementById('heart');
        const msgBox = document.getElementById('msg-box');

        const quotes = [
            "Jia, your hugs melt even the coldest snowman! ❄️🔥",
            "Megh + Jia = A warm hug in a cold world.",
            "Wrapped in Megh's arms, winter feels like summer.",
            "I'm 'snow' in love with your hugs, Jia! ❤️",
            "Sending a chilly hug that warms your soul.",
            "You’re perfectly hug-shaped. Don't ever let go! 😘"
        ];

        let isHugging = false;

        function checkConnection() {
            const rectL = hLeft.getBoundingClientRect();
            const rectR = hRight.getBoundingClientRect();

            if (rectR.left - rectL.right < 10) {
                if (!isHugging) {
                    isHugging = true;
                    document.body.classList.add('hug-active');
                    msgBox.innerText = quotes[Math.floor(Math.random() * quotes.length)];
                    msgBox.classList.add('show-msg');
                }
            } else {
                isHugging = false;
                document.body.classList.remove('hug-active');
                msgBox.classList.remove('show-msg');
            }
        }

        function handleDrag(snowman, isLeft, clientX) {
            let xPercent = (clientX / window.innerWidth) * 100;
            if (isLeft && xPercent < 45) {
                snowman.style.left = (xPercent - 10) + "%";
            } else if (!isLeft && (100 - xPercent) < 45) {
                snowman.style.right = (100 - xPercent - 10) + "%";
            }
            checkConnection();
        }

        // Touch Events
        sLeft.addEventListener('touchmove', (e) => handleDrag(sLeft, true, e.touches[0].clientX));
        sRight.addEventListener('touchmove', (e) => handleDrag(sRight, false, e.touches[0].clientX));

        // Mouse Events
        const mouseHandler = (e) => {
            if (e.buttons !== 1) return;
            if (e.target.closest('#snowman-left')) handleDrag(sLeft, true, e.clientX);
            if (e.target.closest('#snowman-right')) handleDrag(sRight, false, e.clientX);
        };
        document.addEventListener('mousemove', mouseHandler);

        // Snowflakes
        setInterval(() => {
            const f = document.createElement('div');
            f.className = 'snowflake';
            f.innerHTML = '❄';
            f.style.left = Math.random() * 100 + 'vw';
            f.style.fontSize = Math.random() * 20 + 10 + 'px';
            f.style.animationDuration = Math.random() * 3 + 2 + 's';
            f.style.opacity = Math.random();
            document.body.appendChild(f);
            setTimeout(() => f.remove(), 5000);
        }, 300);
    </script>
</body>
</html>
