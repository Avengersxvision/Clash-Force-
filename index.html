<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Jia ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400&family=Mr+Dafoe&display=swap" rel="stylesheet">
    <style>
        :root {
            --glow: #fff0f5;
            --accent: #ff0055;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #050505;
            font-family: 'Montserrat', sans-serif;
        }

        #canvas-container {
            position: relative; width: 100%; height: 100vh;
            background: radial-gradient(circle at center, #1a0a1a 0%, #050505 100%);
            display: flex; justify-content: center; align-items: center;
        }

        .instruction {
            position: absolute; top: 20px; width: 100%; text-align: center;
            color: white; font-weight: 200; letter-spacing: 4px;
            text-transform: uppercase; font-size: 0.8rem; opacity: 0.6;
            pointer-events: none; z-index: 10;
        }

        /* The Neon Message */
        #final-message {
            position: absolute; opacity: 0; text-align: center;
            transition: opacity 2s ease-in-out; pointer-events: none; z-index: 5;
        }

        .main-wish {
            font-family: 'Mr Dafoe', cursive;
            font-size: clamp(3rem, 15vw, 6rem);
            color: var(--glow);
            text-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent), 0 0 40px var(--accent);
            margin: 0;
        }

        .tagline {
            color: white; letter-spacing: 5px; font-size: 0.7rem; margin-top: -10px;
        }

        /* The Stars/Lanterns */
        .star {
            position: absolute; width: 15px; height: 15px;
            background: rgba(255, 255, 255, 0.1); border-radius: 50%;
            cursor: pointer; box-shadow: 0 0 5px rgba(255,255,255,0);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
        }

        .star.lit {
            background: #fff;
            box-shadow: 0 0 20px #fff, 0 0 40px var(--accent);
            transform: scale(1.5);
        }

        /* Heart formation animation */
        .heart-pos {
            transition: all 1.5s ease-in-out !important;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <div class="instruction">Tap the stars to light up Jia's world</div>
        
        <div id="final-message">
            <h1 class="main-wish">Happy Propose Day</h1>
            <p class="tagline">YOU ARE MY BRIGHTEST STAR</p>
        </div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const message = document.getElementById('final-message');
        const totalStars = 12;
        let litCount = 0;

        // Coordinates for a heart shape (scaled to viewport)
        const heartPoints = [
            { x: 50, y: 40 }, { x: 35, y: 30 }, { x: 20, y: 40 }, { x: 20, y: 60 },
            { x: 50, y: 85 }, { x: 80, y: 60 }, { x: 80, y: 40 }, { x: 65, y: 30 },
            { x: 50, y: 55 }, { x: 35, y: 50 }, { x: 65, y: 50 }, { x: 50, y: 70 }
        ];

        function createStars() {
            for (let i = 0; i < totalStars; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                // Random initial positions
                star.style.left = Math.random() * 80 + 10 + "%";
                star.style.top = Math.random() * 80 + 10 + "%";

                star.addEventListener('touchstart', function(e) { e.preventDefault(); lightStar(star); });
                star.addEventListener('click', () => lightStar(star));

                container.appendChild(star);
            }
        }

        function lightStar(star) {
            if (!star.classList.contains('lit')) {
                star.classList.add('lit');
                litCount++;

                if (litCount === totalStars) {
                    revealHeart();
                }
            }
        }

        function revealHeart() {
            const stars = document.querySelectorAll('.star');
            const instruction = document.querySelector('.instruction');
            instruction.style.opacity = '0';

            stars.forEach((star, index) => {
                star.classList.add('heart-pos');
                // Move stars to the heart coordinates
                star.style.left = heartPoints[index].x + "%";
                star.style.top = heartPoints[index].y + "%";
                
                // Pulsing effect
                star.style.animation = `pulse 2s infinite ${index * 0.1}s`;
            });

            // Show the neon text
            setTimeout(() => {
                message.style.opacity = '1';
            }, 1000);
        }

        // Add keyframes for pulsing stars
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes pulse {
                0%, 100% { transform: scale(1.5); opacity: 1; }
                50% { transform: scale(2); opacity: 0.7; box-shadow: 0 0 30px var(--accent); }
            }
        `;
        document.head.appendChild(style);

        createStars();
    </script>
</body>
</html>
